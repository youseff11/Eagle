# Render Blueprint for Eagle.
#
# Three resources, one codebase:
#   eagle-web     Django under daphne (ASGI: pages and the /ws/events/ WebSocket)
#   eagle-worker  `manage.py run_worker` (housekeeping, IMAP IDLE, attendance sweep)
#   eagle-redis   Key Value, the channel layer the two processes above share.
#                 Internal only (empty ipAllowList): no address on the internet.
#
# Secrets are `sync: false`: Render asks for each one in its own dashboard when
# the Blueprint is created. They never live in this file or in git.
#
# The worker starts switched OFF (EAGLE_RUN_WORKER=false). Two workers on one
# database send every attendance alert and every WhatsApp message twice, so it
# is turned on only after the old host's worker has been stopped.

services:
  - type: web
    name: eagle-web
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT Core.asgi:application
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: EAGLE_DEBUG
        value: "false"
      - key: EAGLE_LOG_LEVEL
        value: INFO
      # Under ASGI every request runs in a thread of its own, so a connection
      # kept open for reuse would never be reused: close it with the request.
      - key: EAGLE_CONN_MAX_AGE
        value: "0"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: eagle-redis
          property: connectionString
      # settings.py falls back to a key that is written in the repo. Render makes
      # a random one instead. Changing the key signs everybody out once.
      - key: EAGLE_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BUNNY_STORAGE_ZONE_NAME
        sync: false
      - key: BUNNY_API_KEY
        sync: false
      - key: BUNNY_REGION
        sync: false
      - key: BUNNY_CDN_URL
        sync: false

  - type: worker
    name: eagle-worker
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c 'if [ "$EAGLE_RUN_WORKER" = "true" ]; then exec python manage.py run_worker; else echo "worker is switched off (EAGLE_RUN_WORKER is not true)"; exec sleep infinity; fi'
    autoDeployTrigger: "off"
    envVars:
      - key: EAGLE_DEBUG
        value: "false"
      - key: EAGLE_LOG_LEVEL
        value: INFO
      - key: EAGLE_RUN_WORKER
        value: "false"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: eagle-redis
          property: connectionString
      - key: DATABASE_URL
        sync: false
      - key: BUNNY_STORAGE_ZONE_NAME
        sync: false
      - key: BUNNY_API_KEY
        sync: false
      - key: BUNNY_REGION
        sync: false
      - key: BUNNY_CDN_URL
        sync: false

  - type: keyvalue
    name: eagle-redis
    plan: free
    region: frankfurt
    ipAllowList: []
