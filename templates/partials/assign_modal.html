{% load eagle_tags %}{# Shown by the poller whenever the current user has a pending assignment. #}
<div class="modal-backdrop hidden" id="assignModal">
  <div class="modal">
    <div class="modal__title" data-ar="تاسك جديدة ليك" data-en="A task is waiting for you">تاسك جديدة ليك</div>
    <div class="muted" style="font-size:.84rem"
         data-ar="أكد الاستلام قبل ما العداد يخلص، وإلا هيتخصم من تقييمك."
         data-en="Confirm before the timer runs out, otherwise a rating penalty applies.">
      أكد الاستلام قبل ما العداد يخلص، وإلا هيتخصم من تقييمك.
    </div>

    <div class="countdown" id="assignRing" style="--pct:100">
      <span class="countdown__num" id="assignSeconds">60</span>
    </div>

    <div class="card card--flat" style="text-align:start;padding:12px 14px">
      <div class="kv">
        <span data-ar="التاسك" data-en="Task">التاسك</span>
        <strong class="mono" id="assignTask">—</strong>
      </div>
      <div class="kv">
        <span data-ar="كود العميل" data-en="Client code">كود العميل</span>
        <strong class="mono" id="assignClient">—</strong>
      </div>
      <div class="kv">
        <span data-ar="من" data-en="From">من</span>
        <strong id="assignFrom">—</strong>
      </div>
      <div class="kv">
        <span data-ar="الديدلاين" data-en="Deadline">الديدلاين</span>
        <strong class="mono" id="assignDeadline">—</strong>
      </div>
      <div class="muted" id="assignNote" style="font-size:.8rem"></div>
    </div>

    <div class="row" style="margin-top:16px;justify-content:center">
      <button class="btn btn--ok" id="assignAccept" type="button">
        {% icon "check" %}<span data-ar="استلمت" data-en="Accept">استلمت</span>
      </button>
      <button class="btn btn--danger" id="assignDecline" type="button">
        {% icon "x" %}<span data-ar="رفض" data-en="Decline">رفض</span>
      </button>
      <a class="btn btn--ghost" id="assignOpen" href="#"
         data-ar="افتح التاسك" data-en="Open task">افتح التاسك</a>
    </div>
  </div>
</div>
